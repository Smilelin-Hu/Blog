apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-infra-prefill
spec:
  replicas: 2
  selector:
    matchLabels: {app: ai-infra-prefill}
  template:
    metadata:
      labels: {app: ai-infra-prefill, role: prefill}
    spec:
      containers:
        - name: server
          image: vllm/vllm-openai:latest
          args: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--host", "0.0.0.0"]
          resources:
            limits: {nvidia.com/gpu: "1"}
---
apiVersion: v1
kind: Service
metadata: {name: ai-infra-prefill}
spec:
  selector: {app: ai-infra-prefill}
  ports: [{port: 8000, targetPort: 8000}]
