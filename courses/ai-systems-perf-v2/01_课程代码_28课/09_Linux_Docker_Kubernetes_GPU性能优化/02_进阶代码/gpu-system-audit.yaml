apiVersion: v1
kind: Pod
metadata:
  name: gpu-system-audit
  labels:
    app: gpu-system-audit
spec:
  restartPolicy: Never
  containers:
    - name: audit
      # 生产中替换为内部已验证镜像及不可变 digest
      image: nvcr.io/nvidia/cuda:13.0.2-runtime-ubuntu24.04
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "qos/cgroup"
          cat /sys/fs/cgroup/cpu.max || true
          cat /sys/fs/cgroup/cpu.stat || true
          cat /sys/fs/cgroup/memory.events || true
          echo "shm"
          df -h /dev/shm
          echo "gpu"
          nvidia-smi
          nvidia-smi topo -m
          sleep 3600
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
