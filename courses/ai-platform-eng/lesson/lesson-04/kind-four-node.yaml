kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-platform-lab
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload.training.invalid/pool=interactive,topology.kubernetes.io/zone=zone-a"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload.training.invalid/pool=training,accelerator.training.invalid/class=simulated-gpu,topology.kubernetes.io/zone=zone-a"
          registerWithTaints:
            - "dedicated=training:NoSchedule"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload.training.invalid/pool=serving,topology.kubernetes.io/zone=zone-b"
