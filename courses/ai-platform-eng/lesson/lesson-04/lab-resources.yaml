apiVersion: v1
kind: Namespace
metadata:
  name: lab-notebook
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-training
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-serving
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: notebook-quota
  namespace: lab-notebook
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 3Gi
    pods: "3"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: training-quota
  namespace: lab-training
spec:
  hard:
    requests.cpu: "3500m"
    requests.memory: 7Gi
    pods: "3"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: serving-quota
  namespace: lab-serving
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 3Gi
    pods: "4"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-ai-lab
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: training-artifacts-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: manual-ai-lab
  local:
    path: /tmp/ai-platform-lab-artifacts
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload.training.invalid/pool
              operator: In
              values: [training]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-artifacts
  namespace: lab-training
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-ai-lab
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook
  namespace: lab-notebook
spec:
  replicas: 1
  selector:
    matchLabels: {app: notebook}
  template:
    metadata:
      labels: {app: notebook}
    spec:
      nodeSelector:
        workload.training.invalid/pool: interactive
      initContainers:
        - name: workspace-init
          image: python:3.12-alpine
          command: ["sh", "-c", "echo initialized > /tmp/ai-platform-lab-state"]
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      containers:
        - name: notebook-simulator
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8888"]
          ports: [{containerPort: 8888}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            tcpSocket: {port: 8888}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: {port: 8888}
            periodSeconds: 3
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: training
  namespace: lab-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app: training}
    spec:
      restartPolicy: Never
      nodeSelector:
        workload.training.invalid/pool: training
        accelerator.training.invalid/class: simulated-gpu
      tolerations:
        - {key: dedicated, operator: Equal, value: training, effect: NoSchedule}
      initContainers:
        - name: data-check
          image: python:3.12-alpine
          command: ["sh", "-c", "test -d /artifacts && echo data-ready"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
      containers:
        - name: trainer
          image: python:3.12-alpine
          command: ["sh", "-c", "python -c 'import time; print(\"step=1\"); time.sleep(5); print(\"step=2\")' | tee /results/train.log"]
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "3", memory: 3Gi}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: training-artifacts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: lab-serving
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      nodeSelector:
        workload.training.invalid/pool: serving
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8080"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            tcpSocket: {port: 8080}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: lab-serving
spec:
  selector: {app: inference}
  ports:
    - {name: http, port: 80, targetPort: 8080}
