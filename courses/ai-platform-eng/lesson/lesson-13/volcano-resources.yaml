apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap-example
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "allocate, preempt, reclaim, backfill"
    tiers:
    - plugins:
      - name: priority
      - name: gang
        enablePreemptable: false
      - name: conformance
    - plugins:
      - name: drf
        enablePreemptable: false
      - name: predicates
      - name: capacity
      - name: nodeorder
      - name: binpack
        arguments:
          binpack.weight: 10
          binpack.cpu: 1
          binpack.memory: 1
          binpack.resources: nvidia.com/gpu
          binpack.resources.nvidia.com/gpu: 2
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: online
spec:
  guarantee:
    nvidia.com/gpu: "2"
  deserved:
    nvidia.com/gpu: "4"
  capability:
    nvidia.com/gpu: "6"
  priority: 100
  reclaimable: false
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: offline
spec:
  deserved:
    nvidia.com/gpu: "4"
  capability:
    nvidia.com/gpu: "8"
  priority: 10
  reclaimable: true
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: four-worker-training
  namespace: volcano-lab
spec:
  schedulerName: volcano
  queue: offline
  minAvailable: 4
  maxRetry: 3
  policies:
  - event: PodEvicted
    action: RestartJob
  tasks:
  - name: worker
    replicas: 4
    template:
      spec:
        restartPolicy: OnFailure
        containers:
        - name: worker
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
