apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
data:
  l40s-shared: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: true
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
