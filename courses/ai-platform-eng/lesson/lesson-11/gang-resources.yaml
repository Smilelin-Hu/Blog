apiVersion: scheduling.k8s.io/v1alpha2
kind: PodGroup
metadata:
  name: native-gang-four
  namespace: gang-lab
spec:
  schedulingPolicy:
    gang:
      minCount: 4
---
apiVersion: config.kueue.x-k8s.io/v1beta1
kind: Configuration
metadata:
  name: config
  namespace: kueue-system
waitForPodsReady:
  enable: true
  timeout: 2m
  recoveryTimeout: 1m
  blockAdmission: true
  requeuingStrategy:
    timestamp: Eviction
    backoffLimitCount: 5
    backoffBaseSeconds: 30
    backoffMaxSeconds: 600
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: volcano-gang-four
  namespace: gang-lab
spec:
  minMember: 4
  minResources:
    nvidia.com/gpu: "4"
    cpu: "16"
    memory: 128Gi
  queue: training
  priorityClassName: batch-normal
