apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: datacenter
spec:
  levels:
  - nodeLabel: topology.kubernetes.io/zone
  - nodeLabel: infra.training.invalid/rack
  - nodeLabel: kubernetes.io/hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: h100-rdma
spec:
  nodeLabels:
    accelerator: h100
    network: rdma
  topologyName: datacenter
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: high-memory-gpu
  namespace: topology-dra-lab
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.training.invalid
          selectors:
          - cel:
              expression: device.attributes["gpu.training.invalid"].memoryGiB >= 80
