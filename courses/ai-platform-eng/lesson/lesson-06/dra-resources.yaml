apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.training.invalid
spec:
  selectors:
    - cel:
        expression: device.driver == "gpu.training.invalid"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: high-memory-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.training.invalid
            count: 1
            selectors:
              - cel:
                  expression: device.attributes["gpu.training.invalid"].memoryGiB >= 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-gpu-demo
spec:
  resourceClaims:
    - name: accelerator
      resourceClaimTemplateName: high-memory-gpu
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10.1
      resources:
        claims:
          - name: accelerator
            request: gpu
