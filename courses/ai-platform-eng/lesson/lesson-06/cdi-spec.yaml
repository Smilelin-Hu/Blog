cdiVersion: "0.8.0"
kind: "gpu.training.invalid/device"
devices:
  - name: "a100-0"
    containerEdits:
      deviceNodes:
        - path: "/dev/example-gpu0"
          hostPath: "/dev/example-gpu0"
          permissions: "rw"
      env:
        - "EXAMPLE_VISIBLE_DEVICE=a100-0"
      mounts:
        - hostPath: "/opt/example/lib/libexample-gpu.so"
          containerPath: "/usr/local/lib/libexample-gpu.so"
          options:
            - "ro"
