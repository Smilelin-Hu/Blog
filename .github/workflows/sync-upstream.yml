name: Sync upstream

on:
  schedule:
    # Every 6 hours (UTC): 00:17, 06:17, 12:17, 18:17
    # Beijing time: 08:17, 14:17, 20:17, 02:17
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Smilelin-Hu/Blog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Do not use the merge-upstream API here: this fork contains its own
      # workflow commit, so the branch can diverge while still merging cleanly.
      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/swpucwf/Blog.git 2>/dev/null || true
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master
          git push origin HEAD:master